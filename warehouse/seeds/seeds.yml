version: 2
seeds:
  - name: state_regions
    description: Brazil's 27 federative units and the 5 official IBGE regions they belong to.
    columns:
      - name: state
        tests: [unique, not_null]
      - name: region
        tests:
          - accepted_values:
              arguments:
                values: ["North", "Northeast", "Center-West", "Southeast", "South"]
