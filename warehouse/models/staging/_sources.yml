version: 2

sources:
  - name: raw
    description: Olist CSVs loaded unchanged by `olistwh.ingest` (one table per file).
    schema: raw
    tables:
      - name: orders
        columns:
          - name: order_id
            tests: [unique, not_null]
      - name: customers
        columns:
          - name: customer_id
            tests: [unique, not_null]
      - name: order_items
      - name: order_payments
      - name: order_reviews
      - name: products
        columns:
          - name: product_id
            tests: [unique, not_null]
      - name: sellers
        columns:
          - name: seller_id
            tests: [unique, not_null]
      - name: geolocation
      - name: category_translation
