name: olist_warehouse
version: "1.0.0"
config-version: 2
profile: olist

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # orders before/after these dates are too sparse to compare months fairly (data collection ramp-up and cut-off)
  first_complete_month: "2017-01-01"
  last_complete_month: "2018-08-01"
  bad_review_max_stars: 2        # a review score <= 2 counts as a "bad review"

models:
  olist_warehouse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: core
      analytics:
        +schema: analytics

seeds:
  olist_warehouse:
    +schema: reference
