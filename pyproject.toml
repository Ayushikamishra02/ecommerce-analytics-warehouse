[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olistwh"
version = "1.0.0"
description = "E-commerce analytics warehouse: DuckDB + dbt star schema, tested KPIs, statistics, Power BI pack and Streamlit dashboard on the Olist marketplace data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayushika Mishra" }]
dependencies = [
    "duckdb>=1.1",
    "dbt-duckdb>=1.9",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "pyarrow>=14",
    "tabulate>=0.9",
]

[project.optional-dependencies]
app = ["streamlit>=1.36", "plotly>=5.20"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
olist = "olistwh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E731", "B905", "B023"]
