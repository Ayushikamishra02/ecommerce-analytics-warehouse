name: ci
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[app,dev]"
      - name: Build warehouse (download, load, dbt models + data tests)
        run: olist build
      - name: Python tests
        run: pytest
      - name: Lint
        run: ruff check src tests app
